# ---------------------------------------------------------------------------
# Adv360 GLOBAL layer consumer for macOS / AeroSpace.
#
# Merge this into ~/.aerospace.toml. It implements the same F13-F20 protocol
# as ../windows/adv360-global.ahk and ../linux/hyprland.conf.
#
# The keyboard already applies the modifiers, so every binding here is a bare
# fn-key with modifier prefixes and needs no further remapping.
# ---------------------------------------------------------------------------

[mode.main.binding]

# F13-F20 -> workspace 1-8
f13 = 'workspace 1'
f14 = 'workspace 2'
f15 = 'workspace 3'
f16 = 'workspace 4'
f17 = 'workspace 5'
f18 = 'workspace 6'
f19 = 'workspace 7'
f20 = 'workspace 8'

# Shift+F13-F20 -> move window to workspace 1-8
shift-f13 = 'move-node-to-workspace 1'
shift-f14 = 'move-node-to-workspace 2'
shift-f15 = 'move-node-to-workspace 3'
shift-f16 = 'move-node-to-workspace 4'
shift-f17 = 'move-node-to-workspace 5'
shift-f18 = 'move-node-to-workspace 6'
shift-f19 = 'move-node-to-workspace 7'
shift-f20 = 'move-node-to-workspace 8'

# Ctrl+F13-F16 -> focus left/down/up/right
ctrl-f13 = 'focus left'
ctrl-f14 = 'focus down'
ctrl-f15 = 'focus up'
ctrl-f16 = 'focus right'

# Ctrl+Shift+F13-F16 -> move window left/down/up/right
ctrl-shift-f13 = 'move left'
ctrl-shift-f14 = 'move down'
ctrl-shift-f15 = 'move up'
ctrl-shift-f16 = 'move right'

# Ctrl+F17/F18 -> previous/next workspace
ctrl-f17 = 'workspace prev'
ctrl-f18 = 'workspace next'

# Ctrl+Shift+F17/F18 -> move window to previous/next workspace
# These used to run move-workspace-to-monitor, which moved the whole workspace
# to another display instead of moving the window to the adjacent workspace.
# Linux and Windows both implemented the documented behaviour; macOS did not.
ctrl-shift-f17 = 'move-node-to-workspace --wrap-around prev'
ctrl-shift-f18 = 'move-node-to-workspace --wrap-around next'

# Ctrl+Alt+F13-F16 -> resize left/down/up/right
ctrl-alt-f13 = 'resize width -50'
ctrl-alt-f14 = 'resize height 50'
ctrl-alt-f15 = 'resize height -50'
ctrl-alt-f16 = 'resize width 50'

# Ctrl+Alt+F17/F18 -> focus previous/next monitor
ctrl-alt-f17 = 'focus-monitor --wrap-around prev'
ctrl-alt-f18 = 'focus-monitor --wrap-around next'

# Ctrl+Alt+Shift+F17/F18 -> move window to previous/next monitor
ctrl-alt-shift-f17 = 'move-node-to-monitor --wrap-around prev'
ctrl-alt-shift-f18 = 'move-node-to-monitor --wrap-around next'

# Ctrl+Alt+F19 balance/reset layout, Ctrl+Alt+F20 pin window
ctrl-alt-f19 = 'balance-sizes'
ctrl-alt-f20 = 'layout floating'

# Alt+Shift+F13-F16 -> screenshot region, screenshot window, clipboard, picker
alt-shift-f13 = '''exec-and-forget screencapture -i -c'''
alt-shift-f14 = '''exec-and-forget screencapture -i -w -c'''
alt-shift-f15 = '''exec-and-forget open raycast://extensions/raycast/clipboard-history/clipboard-history'''
alt-shift-f16 = '''exec-and-forget open -a "Digital Color Meter"'''

# Alt+Shift+F17 -> Neovim in a terminal
alt-shift-f17 = '''exec-and-forget open -na "Ghostty" --args -e nvim'''

# Ctrl+F19 fullscreen, Ctrl+Shift+F19 close window
ctrl-f19 = 'fullscreen'
ctrl-shift-f19 = 'close'

# Ctrl+F20 float, Ctrl+Shift+F20 toggle layout
ctrl-f20 = 'layout floating tiling'
ctrl-shift-f20 = 'layout horizontal vertical'

# Alt+F13-F20 -> applications
# AeroSpace has no launcher primitive, so shell out to `open -a`.
alt-f13 = '''exec-and-forget open -a "Ghostty"'''
alt-f14 = '''exec-and-forget open -a "Safari"'''
alt-f15 = '''exec-and-forget open -a "Visual Studio Code"'''
alt-f16 = '''exec-and-forget open -a "Finder"'''
alt-f17 = '''exec-and-forget open -a "Raycast"'''
alt-f18 = '''exec-and-forget open -a "Slack"'''
alt-f19 = '''exec-and-forget open -a "Obsidian"'''
alt-f20 = '''exec-and-forget open -a "Ghostty" --args -e lazygit'''
