# ---------------------------------------------------------------------------
# Adv360 GLOBAL layer consumer for Linux / Hyprland.
#
# Source this from ~/.config/hypr/hyprland.conf:
#     source = ~/path/to/Adv360-Pro-ZMK/host/linux/hyprland.conf
#
# Implements the same F13-F20 protocol as ../macos/aerospace.toml and
# ../windows/adv360-global.ahk.
# ---------------------------------------------------------------------------

# Applications launched by Alt+F13..F20. Override before sourcing if needed.
$term    = ghostty
$browser = firefox
$editor  = code
$files   = nautilus
$launch  = wofi --show drun
$chat    = slack
$notes   = obsidian
$git     = ghostty -e lazygit
$nvim    = ghostty -e nvim

# F13-F20 -> workspace 1-8
bind = , F13, workspace, 1
bind = , F14, workspace, 2
bind = , F15, workspace, 3
bind = , F16, workspace, 4
bind = , F17, workspace, 5
bind = , F18, workspace, 6
bind = , F19, workspace, 7
bind = , F20, workspace, 8

# Shift+F13-F20 -> move window to workspace 1-8
bind = SHIFT, F13, movetoworkspace, 1
bind = SHIFT, F14, movetoworkspace, 2
bind = SHIFT, F15, movetoworkspace, 3
bind = SHIFT, F16, movetoworkspace, 4
bind = SHIFT, F17, movetoworkspace, 5
bind = SHIFT, F18, movetoworkspace, 6
bind = SHIFT, F19, movetoworkspace, 7
bind = SHIFT, F20, movetoworkspace, 8

# Ctrl+F13-F16 -> focus left/down/up/right
bind = CTRL, F13, movefocus, l
bind = CTRL, F14, movefocus, d
bind = CTRL, F15, movefocus, u
bind = CTRL, F16, movefocus, r

# Ctrl+Shift+F13-F16 -> move window left/down/up/right
bind = CTRL SHIFT, F13, movewindow, l
bind = CTRL SHIFT, F14, movewindow, d
bind = CTRL SHIFT, F15, movewindow, u
bind = CTRL SHIFT, F16, movewindow, r

# Ctrl+F17/F18 -> previous/next workspace
bind = CTRL, F17, workspace, e-1
bind = CTRL, F18, workspace, e+1

# Ctrl+Shift+F17/F18 -> move window to previous/next workspace
bind = CTRL SHIFT, F17, movetoworkspace, e-1
bind = CTRL SHIFT, F18, movetoworkspace, e+1

# Ctrl+Alt+F13-F16 -> resize left/down/up/right
bind = CTRL ALT, F13, resizeactive, -40 0
bind = CTRL ALT, F14, resizeactive, 0 40
bind = CTRL ALT, F15, resizeactive, 0 -40
bind = CTRL ALT, F16, resizeactive, 40 0

# Ctrl+Alt+F17/F18 -> focus previous/next monitor
bind = CTRL ALT, F17, focusmonitor, l
bind = CTRL ALT, F18, focusmonitor, r

# Ctrl+Alt+Shift+F17/F18 -> move window to previous/next monitor
bind = CTRL ALT SHIFT, F17, movewindow, mon:l
bind = CTRL ALT SHIFT, F18, movewindow, mon:r

# Ctrl+Alt+F19 balance/reset layout, Ctrl+Alt+F20 pin window
bind = CTRL ALT, F19, layoutmsg, orientationnext
bind = CTRL ALT, F20, pin

# Alt+Shift+F13-F16 -> screenshot region, screenshot window, clipboard, picker
bind = ALT SHIFT, F13, exec, grim -g "$(slurp)" - | wl-copy
bind = ALT SHIFT, F14, exec, grim -g "$(slurp -w)" - | wl-copy
bind = ALT SHIFT, F15, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = ALT SHIFT, F16, exec, hyprpicker -a

# Alt+Shift+F17 -> Neovim in a terminal
bind = ALT SHIFT, F17, exec, $nvim

# Ctrl+F19 fullscreen, Ctrl+Shift+F19 close window
bind = CTRL, F19, fullscreen, 0
bind = CTRL SHIFT, F19, killactive

# Ctrl+F20 float, Ctrl+Shift+F20 toggle split
bind = CTRL, F20, togglefloating
bind = CTRL SHIFT, F20, togglesplit

# Alt+F13-F20 -> applications
bind = ALT, F13, exec, $term
bind = ALT, F14, exec, $browser
bind = ALT, F15, exec, $editor
bind = ALT, F16, exec, $files
bind = ALT, F17, exec, $launch
bind = ALT, F18, exec, $chat
bind = ALT, F19, exec, $notes
bind = ALT, F20, exec, $git
