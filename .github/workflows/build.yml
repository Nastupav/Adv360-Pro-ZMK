name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua syntax parser
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lua5.4
          rm -rf /var/lib/apt/lists/*

      - name: Test workflow contract
        run: python3 -m unittest discover -s tests -v

      - name: Verify firmware and host semantics
        run: python3 scripts/verify_workflow.py

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize west
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build left (ZMK Studio central)
        run: west build -s zmk/app -p -d build/left -b adv360_left -S studio-rpc-usb-uart -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_STUDIO=y

      - name: Build right
        run: west build -s zmk/app -p -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          config_hash=$(python3 scripts/firmware_fingerprint.py)
          commit=${GITHUB_SHA::12}
          prefix="adv360-${commit}-${config_hash}"
          mkdir -p firmware
          cp build/left/zephyr/zmk.uf2 "firmware/${prefix}-left.uf2"
          cp build/right/zephyr/zmk.uf2 "firmware/${prefix}-right.uf2"
          (
            cd firmware
            sha256sum ./*.uf2 > SHA256SUMS
          )
          printf '{\n  "schema": 1,\n  "commit": "%s",\n  "config_sha256": "%s",\n  "dirty": false,\n  "left": true,\n  "right": true\n}\n' \
            "$commit" "$config_hash" > firmware/build-manifest.json

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: adv360-firmware
          path: firmware/
          if-no-files-found: error
