name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate keymap structure
        run: python3 bin/validate_keymap.py

      - name: Validate F13-F20 protocol against host configs
        run: python3 bin/validate_protocol.py

      - name: Check README layer diagrams are current
        run: python3 bin/render_keymap.py --check

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize west
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build left
        run: west build -s zmk/app -p -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Build right
        run: west build -s zmk/app -p -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          prefix="adv360-$(date -u +'%Y%m%d%H%M')-${GITHUB_SHA::7}"
          mkdir -p firmware
          cp build/left/zephyr/zmk.uf2 "firmware/${prefix}-left.uf2"
          cp build/right/zephyr/zmk.uf2 "firmware/${prefix}-right.uf2"
          cd firmware
          sha256sum ./*.uf2 > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: adv360-firmware
          path: firmware/
          if-no-files-found: error
