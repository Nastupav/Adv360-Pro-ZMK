name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate keymap shape
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t counts < <(
            awk '
              /^[[:space:]]*bindings = </ { in_bind = 1; count = 0; next }
              in_bind && /^[[:space:]]*>;/ { print count; in_bind = 0; next }
              in_bind {
                line = $0
                while (match(line, /&[A-Za-z_]+/)) {
                  count++
                  line = substr(line, RSTART + RLENGTH)
                }
              }
            ' config/adv360.keymap
          )
          [[ "${#counts[@]}" -eq 6 ]]
          for count in "${counts[@]}"; do
            [[ "$count" -eq 76 ]]
          done
          ! grep -Eq 'behavior-hold-tap|behavior-macro|studio_unlock' config/adv360.keymap

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize west
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build left
        run: west build -s zmk/app -p -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Build right
        run: west build -s zmk/app -p -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail
          prefix="adv360-$(date -u +'%Y%m%d%H%M')-${GITHUB_SHA::7}"
          mkdir -p firmware
          cp build/left/zephyr/zmk.uf2 "firmware/${prefix}-left.uf2"
          cp build/right/zephyr/zmk.uf2 "firmware/${prefix}-right.uf2"
          cd firmware
          sha256sum ./*.uf2 > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: adv360-firmware
          path: firmware/
          if-no-files-found: error
