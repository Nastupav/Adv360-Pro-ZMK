# Extended report support is required by the host-neutral F13-F20 protocol.
# Note: the extended keyboard report is known to break Android hosts. No
# profile here is an Android device; if that changes, that profile loses
# F13-F24 rather than the whole keymap.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# The full consumer usage range, not the basic 0x00-0xFF subset the board
# defconfigs select. SYS binds C_AL_CALC (0x192), C_AL_FILES (0x194),
# C_AL_LOCK (0x19E) and C_AC_SEARCH (0x221); under the basic range those four
# keys are silently unsendable. BASIC is pinned to n explicitly so the choice
# resolves the same way regardless of fragment ordering.
# Changing either of these two blocks alters the HID report descriptor, so
# hosts must be unpaired and re-paired to pick it up.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=n
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

CONFIG_ZMK_KEYBOARD_NAME="Adv360 Dev"

# Git is the sole keymap authority. Runtime Studio/Clique overrides stay off.
CONFIG_ZMK_STUDIO=n

# Home-row mod timing lives entirely in the &hml / &hmr / &sms behaviors in
# adv360.keymap (tapping-term-ms, quick-tap-ms, require-prior-idle-ms).
# Nothing here needs to change when you retune them.

# The text macros fire at wait-ms/tap-ms = 5, and every tap is two HID
# reports. The longest macro ("IS NOT NULL", 11 taps) needs 22 reports, above
# ZMK's default queue of 20 - which would silently drop characters over BLE
# rather than error. 40 covers every macro in macros.dtsi with headroom, and
# is why the 15-tap cap documented there is safe.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40

# Power. ZMK ships deep sleep off, which on a wireless split is the single
# largest idle drain. Radio and peripherals shut down after 15 minutes; the
# first keypress wakes the half and reconnects.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Lighting is decorative here - there is no layer-indication logic bound to
# it - and the underglow strip is the largest continuous draw on the board.
# Both start off and both are available from SYS on demand.
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_START=10
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
