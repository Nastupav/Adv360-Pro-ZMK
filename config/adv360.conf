# Retain the previous extended keyboard report and NKRO for HID compatibility.
# This profile targets macOS; Android compatibility is not asserted.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# Keep the previous full consumer usage range and descriptor even though SYS
# now uses only media/brightness usages. Descriptor changes may require hosts
# to forget and re-pair their Bluetooth bonds; this revision retains the shape.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=n
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Preserve USB boot protocol support on the left/central for compatible pre-OS
# prompts. It does not affect BLE or make the right peripheral a USB keyboard.
# Actual FileVault/boot-picker compatibility still requires hardware testing.
CONFIG_ZMK_USB_BOOT=y

CONFIG_ZMK_KEYBOARD_NAME="Adv360 Dev"

# Git is the sole keymap authority. Runtime Studio/Clique overrides stay off.
CONFIG_ZMK_STUDIO=n

# Preserve the previous mouse HID descriptor to avoid an unnecessary bond reset.
# The daily-driver keymap has no pointer bindings.
CONFIG_ZMK_POINTING=y

# Retain the existing report queue; daily-driver text uses no macros.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=40

# Retain existing idle/sleep settings. Actual battery and wake behavior depend
# on this vendor fork and the host; no battery-saving percentage is assumed.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Underglow is on at boot; the white key backlight stays off and is available
# from SYS. Both follow the 30-second idle timeout above, so they go dark
# during a pause and come back on the next keypress.
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_START=10
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
