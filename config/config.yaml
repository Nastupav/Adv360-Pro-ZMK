# Unified ADV360 + GlazeWM workflow system.
# AeroSpace-compatible WM grammar mirrored for Windows.
# Uses only F13-F20 plus modifiers for directional/window-manager actions.
# Direction cluster:
# - J = F19 = left
# - K = F20 = down
# - L = Alt+F13 = up
# - ; = Alt+F14 = right

general:
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: "monitor_focus"

gaps:
  inner_gap: "6px"
  outer_gap:
    top: "32px"
    right: "0px"
    bottom: "0px"
    left: "0px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#89b4fa"

workspaces:
  # Main monitor bank.
  - name: "1"
    display_name: "1"
    bind_to_monitor: 0
    keep_alive: true
  - name: "2"
    display_name: "2"
    bind_to_monitor: 0
    keep_alive: true
  - name: "3"
    display_name: "3"
    bind_to_monitor: 0
    keep_alive: true
  - name: "4"
    display_name: "4"
    bind_to_monitor: 0
    keep_alive: true
  - name: "5"
    display_name: "5"
    bind_to_monitor: 0
    keep_alive: true

  # Secondary monitor bank.
  - name: "6"
    display_name: "6"
    bind_to_monitor: 1
    keep_alive: true
  - name: "7"
    display_name: "7"
    bind_to_monitor: 1
    keep_alive: true
  - name: "8"
    display_name: "8"
    bind_to_monitor: 1
    keep_alive: true
  - name: "9"
    display_name: "9"
    bind_to_monitor: 1
    keep_alive: true
  - name: "10"
    display_name: "10"
    bind_to_monitor: 1
    keep_alive: true

window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: true
      shown_on_top: true
    fullscreen:
      maximized: false
      shown_on_top: true

window_rules:
  - commands: ["ignore"]
    match:
      - window_process: { equals: "Taskmgr" }
      - window_process: { equals: "SystemSettings" }
      - window_process: { equals: "mmc" }
      - window_process: { equals: "SearchHost" }
      - window_process: { equals: "StartMenuExperienceHost" }
      - window_process: { equals: "LockApp" }
      - window_process: { regex: "(?i).*powertoys.*" }
      - window_process: { regex: "(?i)yasb.*" }
      - window_class: { regex: "(?i)yasb.*" }

  - commands: ["move --workspace 4"]
    match:
      - window_process: { equals: "Code" }
      - window_process: { equals: "devenv" }
      - window_process: { regex: "(?i)webstorm|rider|idea64|pycharm64|clion64" }

  - commands: ["move --workspace 5"]
    match:
      - window_process: { equals: "WindowsTerminal" }
      - window_process: { equals: "wezterm-gui" }
      - window_process: { equals: "Alacritty" }

  - commands: ["move --workspace 7"]
    match:
      - window_process: { equals: "chrome" }
      - window_process: { equals: "msedge" }
      - window_process: { equals: "brave" }

  - commands: ["move --workspace 8"]
    match:
      - window_process: { equals: "Obsidian" }
      - window_process: { equals: "Notion" }
      - window_process: { equals: "Postman" }
      - window_process: { equals: "azuredatastudio" }
      - window_process: { equals: "explorer" }

  - commands: ["move --workspace 9"]
    match:
      - window_process: { equals: "slack" }
      - window_process: { regex: "(?i)teams" }
      - window_process: { equals: "OUTLOOK" }
      - window_process: { equals: "Zoom" }

keybindings:
  # Monitor focus / monitor move.
  - commands: ["focus --prev-active-workspace-on-monitor"]
    bindings: ["f13"]
  - commands: ["focus --next-active-workspace-on-monitor"]
    bindings: ["f14"]

  - commands: ["move --prev-active-workspace-on-monitor", "focus --prev-active-workspace-on-monitor"]
    bindings: ["shift+f13"]
  - commands: ["move --next-active-workspace-on-monitor", "focus --next-active-workspace-on-monitor"]
    bindings: ["shift+f14"]

  # Workspace cycle.
  - commands: ["focus --prev-active-workspace-on-monitor"]
    bindings: ["f16"]
  - commands: ["focus --next-active-workspace-on-monitor"]
    bindings: ["f17"]

  # Direction cluster.
  - commands: ["focus --direction left"]
    bindings: ["f19"]
  - commands: ["focus --direction down"]
    bindings: ["f20"]
  - commands: ["focus --direction up"]
    bindings: ["alt+f13"]
  - commands: ["focus --direction right"]
    bindings: ["alt+f14"]

  - commands: ["move --direction left"]
    bindings: ["shift+f19"]
  - commands: ["move --direction down"]
    bindings: ["shift+f20"]
  - commands: ["move --direction up"]
    bindings: ["shift+alt+f13"]
  - commands: ["move --direction right"]
    bindings: ["shift+alt+f14"]

  - commands: ["close"]
    bindings: ["shift+f18"]

  # Workspaces 1-8 on supported bank.
  - commands: ["focus --workspace 1"]
    bindings: ["ctrl+f13"]
  - commands: ["focus --workspace 2"]
    bindings: ["ctrl+f14"]
  - commands: ["focus --workspace 3"]
    bindings: ["ctrl+f15"]
  - commands: ["focus --workspace 4"]
    bindings: ["ctrl+f16"]
  - commands: ["focus --workspace 5"]
    bindings: ["ctrl+f17"]
  - commands: ["focus --workspace 6"]
    bindings: ["ctrl+f18"]
  - commands: ["focus --workspace 7"]
    bindings: ["ctrl+f19"]
  - commands: ["focus --workspace 8"]
    bindings: ["ctrl+f20"]

  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["ctrl+shift+f13"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["ctrl+shift+f14"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["ctrl+shift+f15"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["ctrl+shift+f16"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["ctrl+shift+f17"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["ctrl+shift+f18"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["ctrl+shift+f19"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["ctrl+shift+f20"]

  # Secondary bank aliases.
  - commands: ["focus --workspace 1"]
    bindings: ["ctrl+alt+f13"]
  - commands: ["focus --workspace 2"]
    bindings: ["ctrl+alt+f14"]
  - commands: ["focus --workspace 3"]
    bindings: ["ctrl+alt+f15"]
  - commands: ["focus --workspace 4"]
    bindings: ["ctrl+alt+f16"]
  - commands: ["focus --workspace 5"]
    bindings: ["ctrl+alt+f17"]
  - commands: ["focus --workspace 6"]
    bindings: ["ctrl+alt+f18"]
  - commands: ["focus --workspace 7"]
    bindings: ["ctrl+alt+f19"]
  - commands: ["focus --workspace 8"]
    bindings: ["ctrl+alt+f20"]

  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["ctrl+alt+shift+f13"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["ctrl+alt+shift+f14"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["ctrl+alt+shift+f15"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["ctrl+alt+shift+f16"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["ctrl+alt+shift+f17"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["ctrl+alt+shift+f18"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["ctrl+alt+shift+f19"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["ctrl+alt+shift+f20"]

  # Utility / resize row.
  - commands: ["wm-reload-config"]
    bindings: ["ctrl+lwin+f13"]
  - commands: ["wm-redraw"]
    bindings: ["ctrl+lwin+f14"]
  - commands: ["toggle-floating"]
    bindings: ["ctrl+lwin+f15"]
  - commands: ["toggle-fullscreen"]
    bindings: ["ctrl+lwin+f16"]
  - commands: ["set-minimized"]
    bindings: ["ctrl+lwin+f17"]
  - commands: ["resize --width -5%"]
    bindings: ["ctrl+lwin+f18"]
  - commands: ["resize --height +5%"]
    bindings: ["ctrl+lwin+f19"]
  - commands: ["resize --height -5%"]
    bindings: ["ctrl+lwin+f20"]
  - commands: ["resize --width +5%"]
    bindings: ["ctrl+lwin+alt+f13"]
  - commands: ["toggle-tiling-direction"]
    bindings: ["ctrl+lwin+alt+f14"]

  # App launcher layer.
  - commands: ['shell-exec cmd /c start "" wt.exe']
    bindings: ["ctrl+shift+a"]
  - commands: ['shell-exec cmd /c code']
    bindings: ["ctrl+shift+s"]
  - commands: ['shell-exec cmd /c start "" "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"']
    bindings: ["ctrl+shift+d"]
  - commands: ['shell-exec cmd /c start "" explorer.exe']
    bindings: ["ctrl+shift+f"]
  - commands: ['shell-exec cmd /c start "" "%LOCALAPPDATA%\\gitkraken\\gitkraken.exe"']
    bindings: ["ctrl+shift+g"]

  - commands: ['shell-exec cmd /c start "" "%LOCALAPPDATA%\\slack\\slack.exe"']
    bindings: ["ctrl+shift+h"]
  - commands: ['shell-exec cmd /c start "" "%LOCALAPPDATA%\\Microsoft\\Teams\\Update.exe" --processStart "Teams.exe"']
    bindings: ["ctrl+shift+j"]
  - commands: ['shell-exec cmd /c start "" "C:\\Program Files\\Microsoft Office\\root\\Office16\\OUTLOOK.EXE"']
    bindings: ["ctrl+shift+k"]
  - commands: ['shell-exec cmd /c start "" "%LOCALAPPDATA%\\Notion\\Notion.exe"']
    bindings: ["ctrl+shift+l"]
  - commands: ['shell-exec cmd /c start "" "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\KeePass 2.lnk"']
    bindings: ["ctrl+shift+semicolon"]
